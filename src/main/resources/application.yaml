server:
  port: 8081

keycloak:
  auth-server-url: http://localhost:8082
  realm: myrealm
  resource: myclient
  credentials:
    secret: myclientsecret
  admin:
    username: test
    password: test

spring:
  application:
    name: auth-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/myrealm

  datasource:
    url: jdbc:mysql://mysql:3306/keycloak
    username: keycloak
    password: keycloak
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka
        register-with-eureka: true
        fetch-registry: true
      instance:
        prefer-ip-address: true